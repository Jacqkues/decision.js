<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>d1.js demo</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #4f46e5; --bar: #c7d2fe; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --card: #1c1917; --line: #292524; --accent: #818cf8; --bar: #3730a3; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  textarea { width: 100%; min-height: 220px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: 13px/1.45 ui-monospace, monospace; resize: vertical; }
  button { margin-top: 12px; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 13px; margin-left: 10px; }
  #answers { margin-top: 24px; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .row { display: grid; grid-template-columns: 140px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
  .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); }
  .best .fill { background: var(--accent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>d1.js</h1>
  <p class="sub">LiquidAI d1 decisions in your browser, on WebGPU. Nothing leaves this page.</p>
  <div class="grid">
    <div><label for="state">State (text or JSON)</label><textarea id="state"></textarea></div>
    <div><label for="questions">Questions</label><textarea id="questions"></textarea></div>
  </div>
  <button id="run" disabled>Decide</button><span id="status">loading the model…</span>
  <div id="answers"></div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
